hydra:
  run:
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}-${task.name}-${algo.name}
  job:
    chdir: true

headless: true
exp_name: ${oc.select:task.name,test}-${oc.select:algo.name,none}

app:
  headless: ${..headless}
  enable_cameras: ${..eval_render}

sim: ${task.sim}

total_frames: 3_000_000_000
max_iters: -1
eval_interval: -1
eval_render: false
save_interval: 150
seed: 0
checkpoint_path: null

camera_follow: true

wandb:
  name: ${..exp_name}/${now:%m-%d}_${now:%H-%M}
  job_type: train
  entity: cyber dribble
  project: sim2real
  mode: online # online, disabled
  tags: []

defaults:
  - task: motion
  - algo: ppo
  - _self_
