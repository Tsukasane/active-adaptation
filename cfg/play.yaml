# hydra.job.chdir: false

headless: false

app:
  headless: ${..headless}
  enable_cameras: false

sim: ${task.sim}
# env: ${task.env}

total_frames: -1
max_iters: -1
eval_interval: -1
save_interval: -1
seed: 0
checkpoint_path: null
vecnorm: null
export_policy: false

camera_follow: true

wandb:
  group: ${oc.select:..task.name}
  run_name: ${oc.select:..task.name,test}-${oc.select:..algo.name,none}
  job_type: train
  entity: btx0424
  project: sim2real
  mode: online # set to 'disabled' when debugging locally
  run_id: 
  monitor_gym: True
  tags: 


defaults:
  - task: Track
  - algo: ppo
  - _self_

task:
  num_envs: 128
