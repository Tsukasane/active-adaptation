# @package task
name: G1TrackWalk

viewer:
  resolution: [1280, 720]
  lookat: [0., 0., 0.]
  eye: [5.0, 2.0, 2.0]

terrain: plane

# common
num_envs: 4096
max_episode_length: 1000

sim:
  step_dt: 0.02
  isaac_physics_dt: 0.005
  mujoco_physics_dt: 0.002

robot: 
  name: g1_HV
  # robot_type: g1_29dof_rev_1_0
  robot_type: g1_29dof_nohand-feet_sphere
  # override_params:
  #   init_state:
  #     joint_pos:
  #       .*_hip_pitch_joint: -0.3
  #       .*_knee_joint: 0.6
  #       .*_ankle_pitch_joint: -0.3

action:
  _target_: active_adaptation.envs.mdp.action.JointPosition
  action_scaling:
    waist_yaw_joint: 0.25
    waist_roll_joint: 0.25
    waist_pitch_joint: 0.25
    .*hip.*: 0.25
    .*knee.*: 0.25
    .*ankle.*: 0.25
    .*shoulder.*: 0.25
    .*elbow_joint: 0.25
  max_delay: 1
  alpha: [0.8, 1.0]

command:
  _target_: active_adaptation.envs.mdp.commands.locomotion.LocomotionCommand
  linvel_x_range: [0.0, 0.8]
  linvel_y_range: [-0.1, 0.1]
  angvel_range: [-0.5, 0.5]

  yaw_stiffness_range: [0.5, 1.0]
  use_stiffness_ratio: 0.9

  resample_interval: 300
  resample_prob: 0.8
  stand_prob: 0.03

  motion_path:
    - data/motion/AMASS/ACCAD/Female1Walking_c3d-z=-0.1/.*
    # - data/motion/AMASS/KIT/348/.*bend_left.*_poses
    # - data/motion/AMASS/KIT/348/.*bend_right.*_poses
    # - data/motion/AMASS/KIT/348/.*walking_slow.*_poses
    # - data/motion/AMASS/KIT/348/.*walking_medium.*_poses
  lift_height: 0.04

observation:
  command:
    command_lin_vel_b: {}
    command_ang_vel_b: {}
  policy:
    root_ang_vel_history:      {history_steps: [0], noise_std: 0.05}
    projected_gravity_history: {history_steps: [0], noise_std: 0.05}
    joint_pos_history:         {history_steps: [0, 1, 2, 3, 4, 8], noise_std: 0.01}
    prev_actions:              {steps: 3}
  priv:
    root_linvel_b:    {}
    body_height:      {body_names: .*ankle_roll_link}

    applied_action:   {}
    applied_torque:   {}
  amp_obs_:
    joint_pos_history_amp:
      joint_names: ["waist_.*_joint", ".*hip.*_joint", ".*knee_joint", ".*ankle.*_joint", ".*shoulder.*_joint", ".*elbow_joint"]
      history_steps: [0, 1, 2, 3, 4, 8, 16, 32, 48, 64]
    joint_vel_history_amp:
      joint_names: ["waist_.*_joint", ".*hip.*_joint", ".*knee_joint", ".*ankle.*_joint", ".*shoulder.*_joint", ".*elbow_joint"]
      history_steps: [0, 1, 2, 3, 4, 8, 16, 32, 48, 64]
    body_pos_b_history:
      body_names: [".*ankle_roll_link", ".*_knee_link", "pelvis", "torso_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
      history_steps: [0, 1, 2, 3, 4, 8, 16, 32, 48, 64]
    body_ori_b_history:
      body_names: [".*ankle_roll_link", ".*_knee_link", "pelvis", "torso_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
      history_steps: [0, 1, 2, 3]

reward:
  loco:
    track_lin_vel: {weight: 1.0, sigma: 0.25}
    track_ang_vel: {weight: 1.0, sigma: 0.25}

  regularization:
    survival:           {weight: 3.0, enabled: true}

    action_rate_l2:     {weight: 0.01, enabled: true}

    # body_upright:       {weight: 1.0, enabled: true, body_name: "torso_link"}
    # joint_pos_limits:   {weight: 10.0, enabled: true, soft_factor: 0.9, joint_names: [".*_ankle_.*_joint", ".*_knee_joint", "waist_.*_joint"]}
    # joint_vel_l2:       {weight: 1.0e-4, enabled: true, joint_names: [.*shoulder.*]}
    # joint_torques_l2:   {weight: 5.0e-7, enabled: true}
    # feet_upright(body_upright):       {weight: 1.0, enabled: true, body_name: ".*ankle_roll_link"}
    # feet_slip:          {weight: 1.0, enabled: true, body_names: .*ankle_roll_link}

    # energy_l1:          {weight: 2.0e-4, enabled: true}
    # joint_acc_l2:       {weight: 1.0e-7, enabled: true}
    # action_rate2_l2:    {weight: 0.01, enabled: true}

    # body_upright:       {weight: 1.0, enabled: true, body_name: "torso_link"}
    # feet_air_time:      {weight: 2.0, enabled: true, body_names: .*ankle_roll_link, thres: 0.5}
    # joint_deviation_l2: {weight: 0.1, enabled: true, joint_names: [.*shoulder.*, .*hip_roll_joint, .*elbow_joint]}
  debug:
    # body posture
    joint_pos_limits:   {weight: 1.0, enabled: false, soft_factor: 0.9, joint_names: [".*_ankle_.*_joint", ".*_knee_joint", "waist_.*_joint"]}
    body_upright:       {weight: 1.0, enabled: true, body_name: "torso_link"}

    # feet gait
    feet_contact_count: {weight: 1.0, enabled: false, body_names: .*ankle_roll_link}
    feet_slip:          {weight: 1.0, enabled: false, body_names: .*ankle_roll_link}
    impact_force_l2:    {weight: 1.0, enabled: false, body_names: .*ankle_roll_link}
    feet_air_time:      {weight: 1.0, enabled: false, body_names: .*ankle_roll_link, thres: 0.2, soft_discount: 1.0}

randomization:
  perturb_body_mass:
    .*: [0.8, 1.2]
  perturb_body_materials:
    body_names: ".*ankle_roll_link"
    static_friction_range: [0.8, 1.0]
    dynamic_friction_range: [0.8, 1.0]
    restitution_range: [0.0, 0.2]
  perturb_body_com:
    body_names: ["pelvis", "torso_link"]
    com_range: [-0.05, 0.05]
  # motor_params_implicit:
  #   stiffness_range:
  #     .*: [0.9, 1.1]
  #   damping_range:
  #     .*: [0.8, 1.2]
  #   friction_range:
  #     .*: [0.00, 0.01]

  # random_joint_offset: 
  #   .*: [-0.05, 0.05]

  # impulse:
  #   impulse_scale: [10., 10., 1.]
  #   duration_range: [0.1, 0.5]
  #   impulse_prob: 0.001

  # constant_force:
  #   body_names: ["pelvis", ".*_knee_link", "torso_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
  #   force_range: [10, 10, 5]
  #   offset_range: [0.2, 0.2, 0.2]
  #   duration_range: [1.0, 2.0]
  
termination:
  crash: 
    body_names_expr:
    - "pelvis"
    - "torso_link"
    - ".*_hip_.*_link"
    - ".*shoulder_.*_link"
    - ".*(wrist|elbow).*"
  fall_over: {xy_thres: 0.9}
