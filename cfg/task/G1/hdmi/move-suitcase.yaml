# @package task
defaults:
  - G1/hdmi/hdmi-base
  - _self_

name: G1TrackSuitcase

robot:
  override_params:
    init_state:
      joint_pos:
        left_wrist_roll_joint: 1.57
        right_wrist_roll_joint: -1.57

command:
  data_path: data/motion/g1/omomo/sub1_suitcase_011
  
  object_asset_name: "suitcase"
  object_body_name:  "suitcase"

  object_pose_range:
    x: [-0.01, 0.01]
    y: [-0.01, 0.01]
    z: [0.01, 0.01]

  contact_target_pos_offset:
    - [-0.1,-0.16, 0.3]  # left wrist
    - [-0.1, 0.16, 0.3]  # right wrist

  future_steps: [1, 2, 8, 16, 32, 64]
  # replay_motion: true

randomization:
  object_body_randomization:
    static_dynamic_friction_ratio_range: [1.0, 2.0]
    dynamic_friction_range: [0.8, 0.8]
    restitution_range: [0.0, 0.2]
    mass_range: [0.5, 0.5]
  
  body_scale:
    name: "suitcase"
    scale_range: [0.8, 1.1]

reward:
  object_tracking:
    eef_contact_exp: {weight: 5.0, enabled: true, pos_sigma: 0.2, frc_sigma: 0.2, frc_thres: [0.0, 1.0, 0.0]}

termination:
  cum_lost_contact_steps:   {min_steps: 200, pos_thres: 0.2, frc_thres: [0.0, 1.0, 0.0]}
