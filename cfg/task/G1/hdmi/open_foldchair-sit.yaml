# @package task
defaults:
  - base/hdmi-base
  - _self_

name: G1OpenFoldchairSit

robot:
  name: g1_WBT
  robot_type: g1_29dof_nohand-feet_sphere-eef_box-body_capsule

command:
  data_path: data/motion/g1/multi_motion_0726/open_chair_and_sit_amass
  root_body_name: "pelvis"

  object_asset_name: "foldchair"
  object_body_name:  "seat_link"
  object_joint_name: "foldchair_joint"

  object_pose_range:
    roll: [-0.0, 0.0]
    pitch: [-0.0, 0.0]

  contact_target_pos_offset:
    - [0.28, -0.1, 0.02]  # left wrist
    - [0.28, 0.1, 0.02]   # right wrist

observation:
  object:
    object_xy_b:     {noise_std: 0.02, episodic_noise_std: 0.1}
    object_yaw_b:     {noise_std: 0.02, episodic_noise_std: 0.1}
  priv:
    object_joint_pos:    {}
    object_joint_vel:    {}
    object_joint_torque: {}

reward:
  object_tracking:
    object_pos_tracking: {enabled: false}
    object_ori_tracking: {enabled: false}
    object_joint_pos_tracking: {weight: 1.0, sigma: 0.5}

    _multiplicative: true
    eef_contact_exp: {weight: 5.0, enabled: true, pos_sigma: 0.2, frc_sigma: 1.0, frc_thres: [0.0, 1.0, 0.0]}
    eef_contact_exp_2(eef_contact_exp): {weight: 2.0, enabled: true, pos_sigma: 0.5, frc_sigma: 3.0, frc_thres: [0.0, 1.0, 0.0]}

termination:
 cum_lost_contact_steps:   {min_steps: 200, pos_thres: 0.2, frc_thres: 1.0}
