# @package task
name: G1TrackSuitcase

viewer:
  resolution: [1280, 720]
  lookat: [0., 0., 0.]
  eye: [4.0, 4.0, 4.0]
  env_spacing: 5.0

terrain: plane

# common
num_envs: 4096
max_episode_length: 1000

sim:
  step_dt: 0.02
  isaac_physics_dt: 0.005
  mujoco_physics_dt: 0.002

robot: 
  name: g1_HV
  robot_type: g1_29dof_nohand

action:
  _target_: active_adaptation.envs.mdp.action.JointPosition
  action_scaling:
    waist_yaw_joint: 0.25
    waist_roll_joint: 0.25
    waist_pitch_joint: 0.25
    .*hip.*: 0.25
    .*knee.*: 0.25
    .*ankle.*: 0.25
    .*shoulder.*: 0.25
    .*elbow_joint: 0.25
  max_delay: 1
  alpha: [0.8, 1.0]

command:
  _target_: active_adaptation.envs.mdp.commands.hdmi.command.RobotObjectTracking
  data_path: data/motion/omomo/sub1_suitcase_011

  reset_range: [0, 100]
  pose_range:
    x: [-0.05, 0.05]
    y: [-0.05, 0.05]
    z: [-0.01, 0.01]
    roll: [-0.05, 0.05]
    pitch: [-0.05, 0.05]
    yaw: [-0.1, 0.1]

  object_pose_range:
    x: [-0.05, -0.05]
    y: [-0.0, 0.0]
    z: [0.0, 0.0]
    roll: [-0.0, 0.0]
    pitch: [-0.0, 0.0]
    yaw: [-0.05, 0.05]

  joint_pos_noise: 0.1
  joint_vel_noise: 0.1

  lift_height: 0.02

  future_steps: [1, 2, 8, 16, 32]

  object_asset_name: "suitcase"
  object_body_name:  "suitcase"

  contact_target_pos_offset:
    - [0.1, 0.3, -0.1]  # left wrist
    - [-0.1, 0.3, 0.1]  # right wrist

  contact_eef_pos_offset:
    - [0.0, 0.0, 0.0]  # left wrist
    - [0.0, 0.0, 0.0]  # right wrist

  # replay_motion: true

object_names: ["suitcase"]

observation:
  command:
    ref_body_pos_future_local: {}
    ref_motion_phase:          {}
  policy:
    root_ang_vel_history:      {history_steps: [0], noise_std: 0.05}
    projected_gravity_history: {history_steps: [0], noise_std: 0.05}
    joint_pos_history:         {history_steps: [0, 1, 2, 3, 4, 8], noise_std: 0.015}
    prev_actions:              {steps: 3}
    ref_contact_pos_b:          {noise_std: 0.01}
  priv:
    root_ang_vel_history:      {history_steps: [0], noise_std: 0.0}
    projected_gravity_history: {history_steps: [0], noise_std: 0.0}
    joint_pos_history:         {history_steps: [0], noise_std: 0.0}
    ref_contact_pos_b:         {noise_std: 0.0}

    ref_root_pos_future_b: {}
    ref_root_ori_future_b: {}

    # for better reward estimation
    diff_body_pos_future_local: {}
    diff_body_ori_future_local: {}
    diff_body_lin_vel_future_local: {}

    root_linvel_b:    {}
    body_pos_b:       {body_names: ".*ankle_roll_link"}
    body_vel_b:       {body_names: ".*ankle_roll_link"}
    body_height:      {body_names: [".*ankle_roll_link", "pelvis", "torso_link"]}

    applied_action:   {}
    applied_torque:   {}

    # sometimes makes training collapses more easily
    # contact_forces:   {body_names: [".*ankle_roll_link"]}
    # external_forces_b:   {body_names: .*}

    object_pos_b:        {}
    object_ori_b:        {}
    diff_object_pos_future: {}
    diff_object_ori_future: {}

    # for better contact
    ref_object_contact_future: {}
    diff_contact_pos_b: {}

reward:
  tracking:
    tracking_upper_body_pos(keypoint_pos_tracking_local_product):
      body_names: [".*_elbow_link", ".*_wrist_yaw_link"]
      weight: 0.5
      sigma: 0.2
    tracking_upper_body_ori(keypoint_ori_tracking_local_product):
      body_names: [".*_elbow_link", ".*_wrist_yaw_link"]
      weight: 0.5
      sigma: 1.0
    
    tracking_lower_body_pos(keypoint_pos_tracking_local_product):
      body_names: [".*_knee_link", ".*_ankle_roll_link"]
      weight: 0.5
      sigma: 0.2
    tracking_lower_body_ori(keypoint_ori_tracking_local_product):
      body_names: [".*_knee_link", ".*_ankle_roll_link"]
      weight: 0.5
      sigma: 1.0

    tracking_root_pos(keypoint_pos_tracking_product):
      body_names: ["pelvis"]
      weight: 0.5
      sigma: 0.2
    tracking_root_ori(keypoint_ori_tracking_product):
      body_names: ["pelvis"]
      weight: 0.5
      sigma: 1.0

    tracking_body_linvel(keypoint_lin_vel_tracking_product):
      body_names: ["pelvis", ".*_hip_yaw_link", ".*_knee_link", ".*_ankle_roll_link", "torso_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
      weight: 0.5
      sigma: 0.5
    tracking_body_angvel(keypoint_ang_vel_tracking_product):
      body_names: ["pelvis", ".*_hip_yaw_link", ".*_knee_link", ".*_ankle_roll_link", "torso_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
      weight: 0.5
      sigma: 2.5

    joint_pos_tracking_product:
      joint_names: ["waist_.*_joint", ".*_hip_.*_joint", ".*_knee_joint", ".*_shoulder_.*_joint", ".*_elbow_joint"]
      weight: 0.5
      sigma: 0.25
    joint_vel_tracking_product:
      joint_names: ["waist_.*_joint", ".*_hip_.*_joint", ".*_knee_joint", ".*_shoulder_.*_joint", ".*_elbow_joint"]
      weight: 0.5
      sigma: 2.0

  object_tracking:
    object_pos_tracking:      {weight: 1.0, sigma: 0.5}
    object_ori_tracking:      {weight: 1.0, sigma: 1.0}

    # for better contact
    eef_contact_pos:       {weight: 0.5, sigma: 0.5, enabled: false}
    # eef_contact_ori:       {weight: 0.5, sigma: 0.5, enabled: false}
    eef_contact_all:       {weight: 5.0, enabled: true, pos_thres: 0.2, frc_thres: 2.0}

    # TODO: reward downward pushing force
  loco:
    action_rate_l2:     {weight: 0.01, enabled: true}
    joint_vel_l2:       {weight: 2.0e-3, enabled: true, joint_names: .*}
    joint_pos_limits:   {weight: 20.0, enabled: true, soft_factor: 0.9, joint_names: [".*_ankle_.*_joint", ".*_knee_joint", "waist_.*_joint", ".*_elbow_joint"]}
    joint_torque_limits: {weight: 0.01, enabled: true, soft_factor: 0.3}
    # undesired_contact_force_xy: {weight: 0.1, enabled: false, body_names: .*ankle_roll_link, thres: 0.1}
    # angvel_xy_l2:       {weight: 0.01, enabled: true, body_names: ["pelvis", "torso_link"]}
    survival:           {weight: 4.0, enabled: true}
  feet:
    impact_force_l2:    {weight: 1.0, enabled: true, body_names: .*ankle_roll_link}
    feet_slip:          {weight: 0.5, tolerance: 0.0, enabled: true, body_names: .*ankle_roll_link}
    feet_air_time:      {weight: 5.0, enabled: true, body_names: .*ankle_roll_link, thres: 0.5, soft_discount: 1.0}
    # feet_upright_when_contact: {weight: 0.2, enabled: true, body_names: .*ankle_roll_link, xy_sigma: 0.5}
    # feet_slip_angvel:   {weight: 0.2, tolerance: 0.05, enabled: true, body_names: .*ankle_roll_link}
    survival:           {weight: 4.0, enabled: true}
    # feet_swing_height:  {weight: 1.0, enabled: false, body_names: .*ankle_roll_link, target_height: 0.1}
  debug:
    impact_force_l2:    {weight: 0.1, enabled: false, body_names: .*ankle_roll_link}
    feet_slip:          {weight: 0.1, tolerance: 0.05, enabled: false, body_names: .*ankle_roll_link}

    feet_no_contact_when_motion_vel:  {weight: 1.0, enabled: false, body_names: .*ankle_roll_link, motion_vel_thres: 1.0}
    feet_contact_when_motion_contact: {weight: 1.0, enabled: false, body_names: .*ankle_roll_link, motion_vel_thres: 0.8, motion_height_thres: 0.05}

    feet_air_time:      {weight: 5.0, enabled: false, body_names: .*ankle_roll_link, thres: 0.2, soft_discount: 1.0}
    feet_contact_count: {weight: 1.0, enabled: false, body_names: .*ankle_roll_link}

    joint_pos_limits:   {weight: 1.0, enabled: false, soft_factor: 0.9, joint_names: [".*_ankle_.*_joint", ".*_knee_joint", "waist_.*_joint", ".*_elbow_joint"]}
    torque_limits_0.3(joint_torque_limits): {weight: 1.0e-3, enabled: false, soft_factor: 0.3}
    torque_limits_0.6(joint_torque_limits): {weight: 1.0e-3, enabled: false, soft_factor: 0.6}
    torque_limits_0.9(joint_torque_limits): {weight: 1.0e-3, enabled: false, soft_factor: 0.9}

    eef_contact_all:    {weight: 1.0, enabled: false, pos_thres: 0.2, frc_thres: 2.0}

randomization:
  perturb_body_mass:
    .*: [0.8, 1.2]
  perturb_body_materials:
    body_names: ".*ankle_roll_link"
    static_friction_range: [0.4, 0.7]
    dynamic_friction_range: [0.3, 0.5]
    restitution_range: [0.0, 0.2]
  perturb_body_com:
    body_names: ["pelvis", "torso_link"]
    com_range: [-0.05, 0.05]
  # motor_params_implicit:
  #   stiffness_range:
  #     .*: [0.9, 1.1]
  #   damping_range:
  #     .*: [0.8, 1.2]
  #   friction_range:
  #     .*: [0.00, 0.01]

  random_joint_offset: 
    .*: [-0.05, 0.05]

  # impulse:
  #   impulse_scale: [10., 10., 1.]
  #   duration_range: [0.1, 0.5]
  #   impulse_prob: 0.001

  # constant_force:
  #   body_names: ["pelvis", ".*_knee_link", "torso_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
  #   force_range: [10, 10, 5]
  #   offset_range: [0.2, 0.2, 0.2]
  #   duration_range: [1.0, 2.0]

  # object_body_randomization:
  #   static_friction_range: [0.3, 0.6]
  #   dynamic_friction_range: [0.2, 0.5]
  #   restitution_range: [0.0, 0.2]
  #   mass_range: [6.0, 10.0]
  
  # body_scale:
  #   name: "suitcase"
  #   scale_range: [0.95, 1.05]

termination:
  cum_body_pos_error:       {body_names: ".*", min_steps: 25, threshold: 0.5}
  cum_body_pos_error_local: {body_names: ".*", min_steps: 25, threshold: 0.5}
  cum_joint_pos_error:      {joint_names: "^(?!.*(ankle)_.*_joint).*$", min_steps: 25, threshold: 1.0}

  cum_object_pos_error:     {min_steps: 25, threshold: 0.5}
  cum_object_ori_error:     {min_steps: 25, threshold: 1.0}
  cum_lost_contact_steps:   {min_steps: 200, pos_thres: 0.2, frc_thres: 2.0}
