# @package task
defaults:
  - base/tracking-base-wbt
  - _self_

name: G1TrackStool


robot:
  name: g1_WBT
  robot_type: g1_29dof_rubberhand-feet_sphere-eef_box_approx-body_capsule
  override_params:
    init_state:
      joint_pos:
        left_wrist_yaw_joint: -0.8
        right_wrist_yaw_joint: 0.8

# observation:
#   policy:
#     joint_pos_history:         {history_steps: [0, 1], joint_names: "^(?!.*wrist).+$", noise_std: 0.015}

command:
  data_path: data/motion/data_for_sim/move_stool-climb-0814-0_610
  root_body_name: "pelvis"

  pose_range:
    x: [-0.0, 0.0]
    y: [-0.0, 0.0]
    yaw: [-0.0, 0.0]
