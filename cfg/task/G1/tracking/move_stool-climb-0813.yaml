# @package task
defaults:
  - base/tracking-base
  - _self_

name: G1TrackStool

robot:
  name: g1_HV
  robot_type: g1_29dof_nohand-feet_sphere-eef_box-body_capsule
  override_params:
    init_state:
      joint_pos:
        left_wrist_roll_joint: 0.8
        right_wrist_roll_joint: -0.8
        left_wrist_pitch_joint: -0.5
        right_wrist_pitch_joint: -0.5

observation:
  policy:
    joint_pos_history:         {history_steps: [0, 1], joint_names: "^(?!.*wrist).+$", noise_std: 0.015}

command:
  data_path: data/motion/data_for_sim/move_stool-climb-0813-0_740
  root_body_name: "pelvis"

  pose_range:
    x: [-0.0, 0.0]
    y: [-0.0, 0.0]
    yaw: [-0., 0.]
