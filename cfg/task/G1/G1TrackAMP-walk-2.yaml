# @package task
name: G1TrackAMPWalk

viewer:
  resolution: [1280, 720]
  lookat: [0., 0., 0.]
  eye: [5.0, 2.0, 2.0]

terrain: plane

# common
num_envs: 4096
max_episode_length: 1000

sim:
  step_dt: 0.02
  isaac_physics_dt: 0.005
  mujoco_physics_dt: 0.002

robot: 
  name: g1_HV
  robot_type: g1_29dof_nohand-feet_sphere

action:
  _target_: active_adaptation.envs.mdp.action.JointPosition
  action_scaling:
    waist_yaw_joint: 0.25
    waist_roll_joint: 0.25
    waist_pitch_joint: 0.25
    .*hip.*: 0.25
    .*knee.*: 0.25
    .*ankle.*: 0.25
    .*shoulder.*: 0.25
    .*elbow_joint: 0.25
  max_delay: 1
  alpha: [0.8, 1.0]

# command:
#   _target_: active_adaptation.envs.mdp.commands.locomotion.LocomotionCommand
#   linvel_x_range: [-0.6, 1.2]
#   linvel_y_range: [-0.5, 0.5]
#   angvel_range: [-0.8, 0.8]

#   yaw_stiffness_range: [0.5, 1.0]
#   use_stiffness_ratio: 0.9

#   resample_interval: 300
#   resample_prob: 0.8
#   stand_prob: 0.05

#   motion_path:
#     - data/motion/default_controller/low_speed/segment-.*

#   lift_height: 0.05

command:
  _target_: active_adaptation.envs.mdp.commands.motion_tracking.MotionTrackingCommand
  data_path:
    - data/motion/default_controller/low_speed/segment-.*

  lift_height: 0.05

  future_steps: [1, 2, 8, 16, 32]

observation:
  command:
    command_lin_vel_b_motion: {}
    command_ang_vel_b_motion: {}
  policy:
    root_ang_vel_history:      {history_steps: [0], noise_std: 0.05}
    projected_gravity_history: {history_steps: [0], noise_std: 0.05}
    joint_pos_history:         {history_steps: [0, 1, 2, 3, 4, 8], noise_std: 0.01}
    prev_actions:              {steps: 3}
  priv:
    root_linvel_b:    {}
    body_height:      {body_names: .*ankle_roll_link}

    # for motion tracking
    ref_root_pos_future_b: {}
    ref_root_ori_future_b: {}
    ref_joint_pos_future: {}

    # for better reward estimation
    diff_body_pos_future_local: {}
    diff_body_lin_vel_future_local: {}

    applied_action:   {}
    applied_torque:   {}
  amp_obs_:
    joint_pos_history_amp:
      joint_names: ["waist_.*_joint", ".*hip.*_joint", ".*knee_joint", ".*shoulder.*_joint", ".*elbow_joint"]
      history_steps: [0, 1, 2, 3, 4, 8, 16, 32, 48, 64]
    # joint_vel_history_amp:
    #   joint_names: ["waist_.*_joint", ".*hip.*_joint", ".*knee_joint", ".*shoulder.*_joint", ".*elbow_joint"]
    #   history_steps: [0, 1, 2, 3]

    body_pos_b_history:
      body_names: [".*ankle_roll_link", ".*_knee_link", "pelvis", "torso_link", ".*_elbow_link", ".*_wrist_yaw_link"]
      history_steps: [0, 1, 2, 3, 4, 8, 16, 32, 48, 64]
    body_ori_b_history:
      body_names: [".*_knee_link", "pelvis", "torso_link", ".*_elbow_link", ".*_wrist_yaw_link"]
      history_steps: [0, 1, 2, 3]

    # body_lin_vel_b_history:
    #   body_names: [".*ankle_roll_link", ".*_knee_link", "pelvis", "torso_link", ".*_elbow_link", ".*_wrist_yaw_link"]
    #   history_steps: [0, 1, 2, 3]
    # body_ang_vel_b_history:
    #   body_names: [".*_knee_link", "pelvis", "torso_link", ".*_elbow_link", ".*_wrist_yaw_link"]
    #   history_steps: [0, 1, 2, 3]

reward:
  loco:
    track_lin_vel_motion: {weight: 1.0, sigma: 0.5}
    track_ang_vel_motion: {weight: 1.0, sigma: 1.0}
  
  tracking:
    survival:           {weight: 1.0, enabled: false}


    tracking_ee_pos(keypoint_pos_tracking_local_product):
      body_names: [".*_ankle_roll_link", ".*knee_link", ".*_wrist_yaw_link", ".*_elbow_link"]
      weight: 0.5
      sigma: 0.1
      enabled: false
    tracking_ee_ori(keypoint_ori_tracking_local_product):
      body_names: [".*knee_link", ".*_wrist_yaw_link", ".*_elbow_link"]
      weight: 0.5
      sigma: 0.5
      enabled: false

    tracking_root_pos(keypoint_pos_tracking_product):
      body_names: ["pelvis"]
      weight: 0.5
      sigma: 0.2
      enabled: false
    tracking_root_ori(keypoint_ori_tracking_product):
      body_names: ["pelvis"]
      weight: 0.5
      sigma: 1.0
      enabled: false

    tracking_body_linvel(keypoint_lin_vel_tracking_product):
      body_names: ["pelvis", ".*_hip_yaw_link", ".*_knee_link", ".*_ankle_roll_link", "torso_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
      weight: 0.5
      sigma: 0.5
      enabled: false
    tracking_body_angvel(keypoint_ang_vel_tracking_product):
      body_names: ["pelvis", ".*_hip_yaw_link", ".*_knee_link", "torso_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
      weight: 0.5
      sigma: 2.5
      enabled: false

    joint_pos_tracking_product:
      joint_names: ["waist_.*_joint", ".*_hip_.*_joint", ".*_knee_joint", ".*_shoulder_.*_joint", ".*_elbow_joint"]
      weight: 0.5
      sigma: 0.25
      enabled: false
    joint_vel_tracking_product:
      joint_names: ["waist_.*_joint", ".*_hip_.*_joint", ".*_knee_joint", ".*_shoulder_.*_joint", ".*_elbow_joint"]
      weight: 0.5
      sigma: 2.0
      enabled: false

  regularization:
    survival:           {weight: 1.0, enabled: true}
    action_rate_l2:     {weight: 0.01, enabled: true}

    joint_pos_limits:   {weight: 20.0, enabled: true, soft_factor: 0.9, joint_names: [".*_ankle_.*_joint", ".*_knee_joint", "waist_.*_joint", ".*_elbow_joint"]}

    feet_air_time:      {weight: 5.0, enabled: true, body_names: .*ankle_roll_link, thres: 0.4, soft_discount: 1.0}
    feet_close_xy: {weight: 20.0, enabled: true, body_names: .*ankle_roll_link, thres: 0.05}
    feet_slip:          {weight: 0.5, enabled: true, body_names: .*ankle_roll_link}

  debug:
    # body posture
    joint_pos_limits:   {weight: 1.0, enabled: false, soft_factor: 0.9, joint_names: [".*_ankle_.*_joint", ".*_knee_joint", "waist_.*_joint", ".*_elbow_joint"]}
    body_upright:       {weight: 1.0, enabled: false, body_name: "torso_link"}

    # feet gait
    feet_contact_count: {weight: 1.0, enabled: false, body_names: .*ankle_roll_link}
    feet_slip:          {weight: 1.0, enabled: false, body_names: .*ankle_roll_link}
    impact_force_l2:    {weight: 1.0, enabled: false, body_names: .*ankle_roll_link}
    feet_air_time:      {weight: 1.0, enabled: false, body_names: .*ankle_roll_link, thres: 0.2, soft_discount: 1.0}

randomization:
  # perturb_body_mass:
  #   .*: [0.8, 1.2]
  perturb_body_materials:
    body_names: ".*ankle_roll_link"
    static_friction_range: [0.8, 1.0]
    dynamic_friction_range: [0.8, 1.0]
    restitution_range: [0.0, 0.2]
  # perturb_body_com:
  #   body_names: ["pelvis", "torso_link"]
  #   com_range: [-0.05, 0.05]
  # motor_params_implicit:
  #   stiffness_range:
  #     .*: [0.9, 1.1]
  #   damping_range:
  #     .*: [0.8, 1.2]
  #   friction_range:
  #     .*: [0.00, 0.01]

  # random_joint_offset: 
  #   .*: [-0.05, 0.05]

  # impulse:
  #   impulse_scale: [10., 10., 1.]
  #   duration_range: [0.1, 0.5]
  #   impulse_prob: 0.001

  # constant_force:
  #   body_names: ["pelvis", ".*_knee_link", "torso_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
  #   force_range: [10, 10, 5]
  #   offset_range: [0.2, 0.2, 0.2]
  #   duration_range: [1.0, 2.0]
  
termination:
  # cum_body_pos_error: {body_names: ".*", min_steps: 25, threshold: 0.8}
  # cum_body_pos_error_local: {body_names: ".*", min_steps: 25, threshold: 0.5}
  # cum_joint_pos_error: {joint_names: "^(?!.*(ankle|hip)_.*_joint).*$", min_steps: 25, threshold: 1.0}

  crash: 
    body_names_expr:
    - "pelvis"
    - "torso_link"
    - ".*_hip_.*_link"
    - ".*shoulder_.*_link"
    - ".*(wrist|elbow).*"
  fall_over: {xy_thres: 0.9}
