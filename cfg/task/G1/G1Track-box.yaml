# @package task
name: G1TrackBox

viewer:
  resolution: [1280, 720]
  lookat: [0., 0., 0.]
  eye: [4.0, 4.0, 4.0]

terrain: plane

# common
num_envs: 4096
max_episode_length: 1000

sim:
  step_dt: 0.02
  isaac_physics_dt: 0.005
  mujoco_physics_dt: 0.002

robot: 
  name: g1_29dof
  robot_type: g1_29dof_nohand-feet_sphere-eef_L

action:
  _target_: active_adaptation.envs.mdp.action.JointPosition
  action_scaling:
    waist_yaw_joint: 0.25
    waist_roll_joint: 0.25
    waist_pitch_joint: 0.25
    .*hip.*: 0.25
    .*knee.*: 0.25
    .*ankle.*: 0.25
    .*shoulder.*: 0.25
    .*elbow_joint: 0.25
    .*_wrist_.*_joint: 0.25
  max_delay: 1
  alpha: [0.8, 1.0]

command:
  _target_: active_adaptation.envs.mdp.commands.motion_tracking.MotionTrackingBox
  data_path: data/motion/push_box/push_box-VID_20250423_220958-light-high-adjust_root_height-zero_waist_pitch-processed

  cum_keypoint_pos_scale: 0.5
  cum_keypoint_ori_scale: 0.5
  cum_joint_pos_scale: 0.5
  cum_lost_contact_steps: 20

  lift_height: 0.04
  init_root_pos_noise: 0.02
  init_root_ori_noise: 0.1
  init_root_lin_vel_noise: 0.1
  init_root_ang_vel_noise: 0.1
  init_joint_pos_noise: 0.1
  init_joint_vel_noise: 0.1

  # for termination
  contact_eef_pos_thres: 0.1
  contact_eef_ori_thres: 0.1
  contact_eef_frc_thres: 1.0

  box_reset_offset: [-0.1, 0.0, 0.0]

object_names: ["box"]

observation:
  command:
    ref_motion_phase: {}
  policy:
    root_angvel_b:  {noise_std: 0.05}
    projected_gravity_b: {noise_std: 0.01}
    joint_pos_multistep: {steps: 16, noise_std: 0.01}
    joint_vel_multistep: {steps: 4, noise_std: 0.2}
    prev_actions:   {steps: 3}
    box_pos_b: {noise_std: 0.1}
    box_yaw: {noise_std: 0.1}
  priv:
    ref_joint_pos_future: {}
    ref_joint_vel_future: {}
    diff_body_pos_future_b: {}
    diff_body_lin_vel_future_b: {}
    diff_body_ori_future_b: {}
    diff_body_ang_vel_future_b: {}

    box_lin_vel_b: {}
    box_ang_vel_b: {}
    diff_box_pos_future: {}
    box_contact_future: {}
    eef_contact_diff_pos_b: {}
    eef_contact_diff_ori_b: {}

    applied_action:   {}
    root_linvel_b:    {}
    feet_pos_b:       {feet_names: .*ankle_roll_link}
    feet_vel_b:       {feet_names: .*ankle_roll_link}
    applied_torque:   {}
    cum_error:        {}
  # joint_state_:
  #   joint_pos_multistep: {steps: 1, noise_std: 0.0}
  #   joint_vel_multistep: {steps: 1, noise_std: 0.0}

reward:
  tracking_tight:
    keypoint_pos_tracking_product:     {weight: 1.0, sigma: 0.02, tolerance: {.*_wrist_yaw_link: 0.2, .*_elbow_link: 0.2}}
    keypoint_ori_tracking_product:     {weight: 1.0, sigma: 0.1, tolerance: {.*_wrist_yaw_link: 1.0, .*_elbow_link: 1.0}}
    keypoint_lin_vel_tracking_product: {weight: 1.0, sigma: 0.2, tolerance: {.*_wrist_yaw_link: 0.2, .*_elbow_link: 0.2}}
    keypoint_ang_vel_tracking_product: {weight: 1.0, sigma: 0.4, tolerance: {.*_wrist_yaw_link: 1.0, .*_elbow_link: 1.0}}
    joint_pos_tracking_product:        {weight: 0.5, sigma: 0.05, tolerance: {.*_elbow_joint: 0.5}}
    joint_vel_tracking_product:        {weight: 0.5, sigma: 0.2, tolerance: {.*_elbow_joint: 0.5}}
  tracking:
    keypoint_pos_tracking_product:     {weight: 1.0, sigma: 0.1, tolerance: {.*_wrist_yaw_link: 0.2, .*_elbow_link: 0.2}}
    keypoint_ori_tracking_product:     {weight: 1.0, sigma: 0.5, tolerance: {.*_wrist_yaw_link: 1.0, .*_elbow_link: 1.0}}
    keypoint_lin_vel_tracking_product: {weight: 1.0, sigma: 1.0, tolerance: {.*_wrist_yaw_link: 0.2, .*_elbow_link: 0.2}}
    keypoint_ang_vel_tracking_product: {weight: 1.0, sigma: 2.0, tolerance: {.*_wrist_yaw_link: 1.0, .*_elbow_link: 1.0}}
    joint_pos_tracking_product:        {weight: 0.5, sigma: 0.25, tolerance: {.*_elbow_joint: 0.5}}
    joint_vel_tracking_product:        {weight: 0.5, sigma: 1.0, tolerance: {.*_elbow_joint: 0.5}}
  tracking_box:
    box_pos_tracking:                  {weight: 1.0, sigma: 0.25}
    box_ori_tracking:                  {weight: 1.0, sigma: 0.25}
    eef_contact_pos:                   {weight: 1.0, sigma: 0.5}
    eef_contact_ori:                   {weight: 1.0, sigma: 1.0}
    eef_contact_all:                   {weight: 1.0, pos_thres: 0.25, ori_thres: 0.5, frc_thres: 2.0}
  contact_tight:
    eef_contact_pos:                   {weight: 1.0, sigma: 0.1}
    eef_contact_ori:                   {weight: 1.0, sigma: 0.2}
    eef_contact_all:                   {weight: 1.0, pos_thres: 0.05, ori_thres: 0.1, frc_thres: 2.0}
  loco:
    impact_force_l2:    {weight: 5.0, enabled: true, body_names: .*ankle_roll_link}
    feet_slip:          {weight: 5.0, tolerance: 0.05, enabled: true, body_names: .*ankle_roll_link}
    joint_vel_l2:       {weight: 2.0e-3, enabled: true, joint_names: .*}
    joint_torque_limits: {weight: 1.0e-2, enabled: true, soft_factor: 0.3}
    action_rate_l2:     {weight: 0.01, enabled: true}
    angvel_xy_l2:       {weight: 0.01, enabled: true, body_names: ["pelvis", "torso_link"]}

    cum_error_penalty:  {weight: 5.0, enabled: true, thres: 1.0}
    survival:           {weight: 1.0, enabled: true}

    feet_air_time:      {weight: 5.0, enabled: false, body_names: .*ankle_roll_link, thres: 0.2}
    feet_air_time_log:  {weight: 1.0, enabled: false, body_names: .*ankle_roll_link, thres: 0.1}
    feet_contact_count: {weight: 1.0, enabled: false, body_names: .*ankle_roll_link}

    feet_no_contact_when_motion_vel:  {weight: 1.0, enabled: true, body_names: .*ankle_roll_link, motion_vel_thres: 0.2}
    feet_contact_when_motion_contact: {weight: 1.0, enabled: true, body_names: .*ankle_roll_link, motion_vel_thres: 0.2, motion_height_thres: 0.05}

randomization:
  perturb_body_materials:
    body_names: ".*ankle_roll_link"
    static_friction_range: [0.1, 2.0]
    dynamic_friction_range: [0.1, 2.0]
    restitution_range: [0.0, 0.2]
  
  motor_params_implicit:
    stiffness_range:
      .*: [0.98, 1.02]
    damping_range:
      .*: [0.98, 1.02]
    armature_range:
      .*: [0.0, 0.01]
  # impulse: {}
  random_joint_offset: 
    .*: [-0.05, 0.05]
  # constant_force:
  #   force_range: [50, 50, 15]
  #   offset_range: [0.1, 0.1, 0.1]
  # step_torque_rfi: {rfi_scale: 0.01}
  # episode_torque_rfi: {rfi_scale: 0.01}

termination:
  cum_error: {thres: 1.0, min_steps: 5}