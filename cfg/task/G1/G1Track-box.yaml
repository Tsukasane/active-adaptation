# @package task
name: G1TrackBox

viewer:
  resolution: [1280, 720]
  lookat: [0., 0., 0.]
  eye: [4.0, 4.0, 4.0]

terrain: plane

# common
num_envs: 4096
max_episode_length: 1000

sim:
  step_dt: 0.02
  isaac_physics_dt: 0.005
  mujoco_physics_dt: 0.002

robot: 
  name: g1_HV
  robot_type: g1_29dof_nohand-feet_sphere-eef_L
  override_params:
    init_state:
      joint_pos:
        .*_elbow_joint: 0.0
    # actuators:
    #   base_legs:
    #     stiffness:
    #       ".*_shoulder_.*_joint": 10.0
    #       ".*_elbow_joint": 5.0
    #       ".*_wrist_.*_joint": 1.0
    #       ".*_ankle_.*_joint": 5.0

action:
  _target_: active_adaptation.envs.mdp.action.JointPosition
  action_scaling:
    waist_yaw_joint: 0.25
    waist_roll_joint: 0.25
    waist_pitch_joint: 0.25
    .*hip.*: 0.25
    .*knee.*: 0.25
    .*ankle.*: 0.25
    .*shoulder.*: 0.25
    .*elbow_joint: 0.25
    .*_wrist_.*_joint: 0.25
  max_delay: 1
  alpha: [0.8, 1.0]

command:
  _target_: active_adaptation.envs.mdp.commands.motion_tracking.MotionTrackingBox
  data_path: data/motion/push_box/push_box-VID_20250423_220958-light-high-adjust_root_height-zero_waist_pitch-processed

  pose_range:
    x: [-0.05, 0.05]
    y: [-0.05, 0.05]
    z: [-0.01, 0.01]
    roll: [-0.05, 0.05]
    pitch: [-0.05, 0.05]
    yaw: [-0.1, 0.1]

  # init_joint_pos_noise: 0.2

  box_pose_range:
    x: [-0.1, -0.0]
    y: [-0.0, 0.0]
    z: [0.0, 0.0]
    roll: [-0.0, 0.0]
    pitch: [-0.0, 0.0]
    yaw: [-0.05, 0.05]

  lift_height: 0.05
  future_steps: [1, 2, 8, 16, 32]

object_names: ["box"]

observation:
  command:
    ref_joint_pos_future: {}
    ref_body_pos_future_local: {}
    ref_body_ori_future_local: {}
    ref_motion_phase:          {}
  policy:
    root_ang_vel_history:      {history_steps: [0], noise_std: 0.05}
    projected_gravity_history: {history_steps: [0], noise_std: 0.05}
    joint_pos_history:         {history_steps: [0, 1, 2, 3, 4, 8], noise_std: 0.01}
    prev_actions:              {steps: 3}
    eef_target_pos_b:          {noise_std: 0.0}
    box_yaw:                   {noise_std: 0.1}
  priv:
    root_ang_vel_history:      {history_steps: [0], noise_std: 0.0}
    projected_gravity_history: {history_steps: [0], noise_std: 0.0}
    joint_pos_history:         {history_steps: [0], noise_std: 0.0}
    box_pos_b:                 {noise_std: 0.0}
    box_yaw:                   {noise_std: 0.0}

    ref_root_pos_future_b: {}
    ref_root_ori_future_b: {}

    # for better reward estimation
    diff_body_pos_future_local: {}
    diff_body_ori_future_local: {}
    diff_body_lin_vel_future_local: {}

    root_linvel_b:    {}
    body_pos_b:       {body_names: ".*ankle_roll_link"}
    body_vel_b:       {body_names: ".*ankle_roll_link"}
    body_height:      {body_names: [".*ankle_roll_link", "pelvis", "torso_link"]}
    # contact_forces:   {body_names: [".*ankle_roll_link"]}

    applied_action:   {}
    applied_torque:   {}
    # external_forces_b:   {body_names: .*}

    box_lin_vel_b: {}
    box_ang_vel_b: {}
    diff_box_pos_future: {}
    diff_box_yaw_future: {}

    # for better contact
    box_contact_future: {}
    eef_contact_diff_pos_b: {}
    eef_contact_diff_ori_b: {}

reward:
  tracking:
    tracking_upper_body_pos(keypoint_pos_tracking_local_product):
      body_names: ["torso_link", ".*_elbow_link"]
      weight: 0.5
      sigma: 1.0
    tracking_upper_body_ori(keypoint_ori_tracking_local_product):
      body_names: ["torso_link", ".*_elbow_link"]
      weight: 0.5
      sigma: 3.0
    # tracking_upper_body_linvel(keypoint_lin_vel_tracking_local_product):
    #   body_names: ["torso_link", ".*_wrist_yaw_link", ".*_elbow_link"]
    #   weight: 0.5
    #   sigma: 4.0
    
    tracking_lower_body_pos(keypoint_pos_tracking_local_product):
      body_names: [".*_hip_yaw_link", ".*_knee_link", ".*_ankle_roll_link"]
      weight: 0.5
      sigma: 0.2
    tracking_lower_body_ori(keypoint_ori_tracking_local_product):
      body_names: [".*_hip_yaw_link", ".*_knee_link", ".*_ankle_roll_link"]
      weight: 0.5
      sigma: 0.5
    tracking_lower_body_linvel(keypoint_lin_vel_tracking_local_product):
      body_names: [".*_hip_yaw_link", ".*_knee_link", ".*_ankle_roll_link"]
      weight: 0.5
      sigma: 1.0

    tracking_root_pos(keypoint_pos_tracking_local_product):
      body_names: ["pelvis"]
      weight: 0.5
      sigma: 0.3
    tracking_root_ori(keypoint_ori_tracking_local_product):
      body_names: ["pelvis"]
      weight: 0.5
      sigma: 1.0
    tracking_root_linvel(keypoint_lin_vel_tracking_product):
      body_names: ["pelvis"]
      weight: 0.5
      sigma: 2.0
    # tracking_root_angvel(keypoint_ang_vel_tracking_product):
    #   body_names: ["pelvis"]
    #   weight: 0.5
    #   sigma: 2.0

    joint_pos_tracking_product:
      joint_names: ["waist_.*_joint", ".*_hip_.*_joint", ".*_knee_joint", ".*_shoulder_.*_joint"]
      weight: 0.5
      sigma: 0.25
    joint_vel_tracking_product:
      joint_names: ["waist_.*_joint", ".*_hip_.*_joint", ".*_knee_joint", ".*_shoulder_.*_joint"]
      weight: 0.5
      sigma: 2.0
 
  push_box:
    box_pos_tracking:                  {weight: 0.5, sigma: 0.25}
    box_ori_tracking:                  {weight: 0.5, sigma: 0.25}

    # for better contact
    eef_contact_pos:                   {weight: 2.0, sigma: 0.2}
    eef_contact_ori:                   {weight: 2.0, sigma: 0.5}
    eef_contact_pos_larger(eef_contact_pos):                   {weight: 2.0, sigma: 0.5}
    # eef_contact_in_range:              {weight: 4.0, enabled: true}
    # eef_contact_all:                   {weight: 5.0, enabled: true, pos_thres: 0.05, ori_thres: 0.1, frc_thres: 2.0}
  loco:
    action_rate_l2:      {weight: 0.01, enabled: true}
    joint_vel_l2:        {weight: 2.0e-3, enabled: true, joint_names: .*}
    joint_pos_limits:    {weight: 20.0, enabled: true, soft_factor: 0.9, joint_names: [".*_ankle_.*_joint", ".*_knee_joint", "waist_.*_joint", ".*_elbow_joint", ".*_wrist_.*_joint"]}
    # joint_torque_limits: {weight: 1.0e-2, enabled: true, soft_factor: 0.9}
    # angvel_xy_l2:        {weight: 0.01, enabled: true, body_names: ["pelvis", "torso_link"]}
    survival:            {weight: 2.0, enabled: true}
  feet:
    feet_no_contact_when_motion_vel:  {weight: 2.0, enabled: true, body_names: .*ankle_roll_link, motion_vel_thres: 1.0, soft_discount: 1.0}
    # feet_no_contact_force_when_motion_vel: {weight: 0.1, enabled: true, body_names: .*ankle_roll_link, motion_vel_thres: 0.5}
    feet_contact_when_motion_contact: {weight: 1.0, enabled: true, body_names: .*ankle_roll_link, motion_vel_thres: 0.5, motion_height_thres: 0.05}
    # feet_close_xy: {weight: 20.0, enabled: true, body_names: .*ankle_roll_link, thres: 0.1}

    # impact_force_l2:    {weight: 5.0, enabled: true, body_names: .*ankle_roll_link}
    feet_slip:          {weight: 0.2, tolerance: 0.05, enabled: true, body_names: .*ankle_roll_link}
    feet_slip_angvel:   {weight: 0.2, tolerance: 0.05, enabled: true, body_names: .*ankle_roll_link}
    # feet_air_time:      {weight: 2.0, enabled: true, body_names: .*ankle_roll_link, thres: 0.5, soft_discount: 1.0}
    feet_upright: {weight: 1.0, enabled: true, body_names: .*ankle_roll_link, xy_sigma: 1.0}
    # feet_upright_when_contact: {weight: 1.0, enabled: true, body_names: .*ankle_roll_link, xy_sigma: 0.5}

    # feet_swing_height:  {weight: 1.0, enabled: false, body_names: .*ankle_roll_link, target_height: 0.1}
  debug:
    impact_force_l2:    {weight: 0.1, enabled: false, body_names: .*ankle_roll_link}
    feet_slip:          {weight: 0.1, tolerance: 0.05, enabled: false, body_names: .*ankle_roll_link}

    feet_no_contact_when_motion_vel:  {weight: 1.0, enabled: false, body_names: .*ankle_roll_link, motion_vel_thres: 1.0}
    feet_contact_when_motion_contact: {weight: 1.0, enabled: false, body_names: .*ankle_roll_link, motion_vel_thres: 0.8, motion_height_thres: 0.05}

    feet_air_time:      {weight: 5.0, enabled: false, body_names: .*ankle_roll_link, thres: 0.2, soft_discount: 1.0}
    feet_contact_count: {weight: 1.0, enabled: false, body_names: .*ankle_roll_link}

    eef_contact_all:    {weight: 1.0, enabled: false, pos_thres: 0.05, ori_thres: 0.1, frc_thres: 2.0}

randomization:
  perturb_body_mass:
    .*: [0.8, 1.2]
  perturb_body_materials:
    body_names: ".*ankle_roll_link"
    static_friction_range: [0.8, 1.0]
    dynamic_friction_range: [0.8, 1.0]
    restitution_range: [0.0, 0.2]
  perturb_body_com:
    body_names: ["pelvis", "torso_link"]
    com_range: [-0.05, 0.05]

  # motor_params_implicit:
  #   stiffness_range:
  #     .*: [0.9, 1.1]
  #   damping_range:
  #     .*: [0.8, 1.2]
  #   friction_range:
  #     .*: [0.00, 0.01]

  random_joint_offset: 
    .*: [-0.01, 0.01]

  # impulse:
  #   impulse_scale: [10., 10., 1.]
  #   duration_range: [0.1, 0.5]
  #   impulse_prob: 0.001

  # constant_force:
  #   body_names: ["pelvis", ".*_knee_link", "torso_link", ".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
  #   force_range: [10, 10, 5]
  #   offset_range: [0.2, 0.2, 0.2]
  #   duration_range: [1.0, 2.0]

  box_body_randomization:
    static_friction_range: [0.4, 0.8]
    dynamic_friction_range: [0.4, 0.8]
    restitution_range: [0.0, 0.2]
    mass_range: [4.0, 10.0]
  
  body_scale:
    name: "box"
    scale_range: [0.9, 1.1]
    # scale_range: [0.9, 0.9]

termination:
  cum_body_pos_error:       {body_names: ".*", min_steps: 25, threshold: 0.5}
  cum_body_pos_error_local: {body_names: ".*", min_steps: 25, threshold: 0.5}
  cum_joint_pos_error:      {joint_names: "^(?!.*(ankle|hip)_.*_joint).*$", min_steps: 25, threshold: 1.0}

  cum_box_pos_error:        {min_steps: 25, threshold: 0.3}
  cum_box_ori_error:        {min_steps: 25, threshold: 0.5}
  cum_lost_contact_steps:   {pos_thres: 0.1, ori_thres: 0.3, frc_thres: 2.0, min_steps: 25}
