# @package task
name: G1Track

defaults:
  # see https://hydra.cc/docs/advanced/overriding_packages/
  - /task/G1/G1
  - _self_

flags: [""]

command:
  _target_: active_adaptation.envs.mdp.commands.motion_tracking.MotionTrackingCommand
  data_path: data/motion/walk1_subject1-processed
  # data_path: data/motion/walk1_subject1_new-processed
  cum_keypoint_pos_scale: 0.5
  cum_keypoint_ori_scale: 0.5
  cum_joint_pos_scale: 0.5

  lift_height: 0.02
  init_root_pos_noise: 0.02
  init_root_ori_noise: 0.4
  init_root_lin_vel_noise: 0.1
  init_root_ang_vel_noise: 0.1
  init_joint_pos_noise: 0.3
  init_joint_vel_noise: 0.5

observation:
  command:
    ref_motion_phase: {}
  policy:
    root_angvel_b:  {noise_std: 0.05}
    projected_gravity_b: {noise_std: 0.01}
    joint_pos_multistep: {steps: 16, noise_std: 0.01}
    joint_vel_multistep: {steps: 4, noise_std: 1.0}
    prev_actions:   {steps: 4}
  priv:
    ref_joint_pos_future: {}
    ref_joint_vel_future: {}
    diff_body_pos_future_b: {}
    diff_body_lin_vel_future_b: {}
    diff_body_ori_future_b: {}
    diff_body_ang_vel_future_b: {}
    applied_action:   {}
    root_linvel_b:    {}
    feet_pos_b:       {feet_names: .*ankle_roll_link}
    feet_vel_b:       {feet_names: .*ankle_roll_link}
    applied_torque:   {}
    cum_error:        {}
  # joint_state_:
  #   joint_pos_multistep: {steps: 1, noise_std: 0.0}
  #   joint_vel_multistep: {steps: 1, noise_std: 0.0}

reward:
  tracking:
    keypoint_pos_tracking_local_product:     {weight: 1.0, sigma: 0.1}
    keypoint_ori_tracking_local_product:     {weight: 1.0, sigma: 0.5}
    keypoint_lin_vel_tracking_local_product: {weight: 1.0, sigma: 1.0}
    keypoint_ang_vel_tracking_local_product: {weight: 1.0, sigma: 1.0, enabled: false}
    joint_pos_tracking_product:              {weight: 0.5, sigma: 0.5}
    joint_vel_tracking_product:              {weight: 0.5, sigma: 1.0}
  tracking_tight:
    keypoint_pos_tracking_local_product:     {weight: 1.0, sigma: 0.02}
    keypoint_ori_tracking_local_product:     {weight: 1.0, sigma: 0.05}
    keypoint_lin_vel_tracking_local_product: {weight: 1.0, sigma: 0.2}
    keypoint_ang_vel_tracking_local_product: {weight: 1.0, sigma: 0.2, enabled: false}
    joint_pos_tracking_product:              {weight: 0.5, sigma: 0.1}
    joint_vel_tracking_product:              {weight: 0.5, sigma: 0.2}
  loco:
    impact_force_l2:    {weight: 2.0, enabled: true, body_names: .*ankle_roll_link}
    feet_slip:          {weight: 2.0, tolerance: 0.05, enabled: true, body_names: .*ankle_roll_link}
    feet_swing_height:  {weight: 0.01, enabled: false, body_names: .*ankle_roll_link, target_height: 0.2}
    feet_air_time:      {weight: 3.0, enabled: false, body_names: .*ankle_roll_link, thres: 0.2, soft_discount: 1.0}
    feet_air_time_log:  {weight: 5.0, enabled: true, body_names: .*ankle_roll_link, thres: 0.2, soft_discount: 1.0}
    joint_vel_l2:       {weight: 5.0e-4, enabled: true, joint_names: .*}
    action_rate_l2:     {weight: 0.01, enabled: true}
    # feet_air_time_ref:      {weight: 10.0, enabled: true, body_names: [left_ankle_roll_link, right_ankle_roll_link], thres: 0.5}
    angvel_xy_l2:       {weight: 0.01, enabled: true, body_names: ["pelvis", "torso_link"]}

    feet_contact_count: {weight: 1.0, enabled: false, body_names: .*ankle_roll_link}
    cum_error_penalty:  {weight: 5.0, enabled: true, thres: 1.0, min_steps: 25}
    survival:           {weight: 1.0, enabled: true}

    feet_no_contact_when_motion_vel:  {weight: 1.0, enabled: true, body_names: .*ankle_roll_link, motion_vel_thres: 0.1}
    feet_contact_when_motion_contact: {weight: 1.0, enabled: true, body_names: .*ankle_roll_link, motion_vel_thres: 0.1, motion_height_thres: 0.05}

randomization:
  perturb_body_mass:
    .*: [0.8, 1.2]
  perturb_body_materials:
    body_names: ".*ankle_roll_link"
    static_friction_range: [0.1, 2.0]
    dynamic_friction_range: [0.1, 2.0]
    restitution_range: [0.0, 0.2]
  motor_params_implicit:
    stiffness_range:
      .*: [0.8, 1.1]
    damping_range:
      .*: [0.8, 1.1]
    armature_range:
      .*: [0.0, 0.01]
  # reset_joint_states_uniform:
  #   pos_ranges:
  #     .*: [-0.1, 0.1]
  #   rel: true
  # impulse: {}
  random_joint_offset: 
    .*: [-0.05, 0.05]
  # constant_force:
  #   force_range: [50, 50, 15]
  #   offset_range: [0.1, 0.1, 0.1]

termination:
  cum_error: {thres: 1.0, min_steps: 25}