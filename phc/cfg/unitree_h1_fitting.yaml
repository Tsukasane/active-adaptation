humanoid_type: h1

asset:
  assetFileName: "assets/robot/unitree_h1/h1.xml"

#### Config for extension
extend_config:
  - joint_name: "left_hand_link"
    parent_name: "left_elbow_link"
    pos: [0.3, 0.0, 0.0]
    rot: [1.0, 0.0, 0.0, 0.0]
  - joint_name: "right_hand_link"
    parent_name: "right_elbow_link"
    pos: [0.3, 0.0, 0.0]
    rot: [1.0, 0.0, 0.0, 0.0]
  - joint_name: "head_link"
    parent_name: "pelvis"
    pos: [0.0, 0.0, 0.6]
    rot: [1.0, 0.0, 0.0, 0.0]
  - joint_name: "left_toe_link"
    parent_name: "left_ankle_link"
    pos: [0.08, 0.0, 0.0]
    rot: [1.0, 0.0, 0.0, 0.0]

  - joint_name: "right_toe_link"
    parent_name: "right_ankle_link"
    pos: [0.08, 0.0, 0.0]
    rot: [1.0, 0.0, 0.0, 0.0]
    

base_link: "torso_link"
joint_matches:
  - ["pelvis", "Pelvis"]
  - ["left_hip_yaw_link", "L_Hip"]
  - ["left_knee_link", "L_Knee"]
  - ["left_ankle_link", "L_Ankle"]
  - ["right_hip_yaw_link", "R_Hip"]
  - ["right_knee_link", "R_Knee"]
  - ["right_ankle_link", "R_Ankle"]
  - ["left_shoulder_roll_link", "L_Shoulder"]
  - ["left_elbow_link", "L_Elbow"]
  - ["left_hand_link", "L_Hand"]
  - ["right_shoulder_roll_link", "R_Shoulder"]
  - ["right_elbow_link", "R_Elbow"]
  - ["right_hand_link", "R_Hand"]
  - ["head_link", "Head"]
  - ["left_toe_link", "L_Toe"]
  - ["right_toe_link", "R_Toe"]


smpl_pose_modifier:
  - Pelvis: "[np.pi/2, 0, np.pi/2]"
  - L_Shoulder: "[0, 0, -np.pi/2]"
  - R_Shoulder: "[0, 0, np.pi/2]"
  - L_Elbow: "[0, -np.pi/2, 0]"
  - R_Elbow: "[0, np.pi/2, 0]"